sam3_inference:
  ros__parameters:
    checkpoint: /home/administrator/opennav-sam3-inference-models/sam3  # Absolute path to the SAM3 checkpoint
    onnx_dir: /home/administrator/opennav-sam3-inference-models/onnx_files_504  # Absolute path to the directory containing ONNX files
    
    prompts: ["floor"]
    class_ids: [1]

    # prompts: ["floor", "wall", "desk", "chair", "shelf and cabinet"]
    # class_ids: [1, 2, 3, 4, 5]

    # prompts: ["paved cement", "asphalt road", "grass field"]
    # class_ids: [1, 2, 3]

    # prompts: ["paved cement sidewalk", "grass field"]
    # class_ids: [1, 2]

    # prompts: ["asphalt lane", "bike lane", "sidewalk", "bushes and plants"]
    # class_ids: [1, 2, 3, 4]

    # prompts: ["paved cement", "car", "tree"]
    # class_ids: [1, 2, 3]
    
    device: cuda
    score_threshold: 0.5
    max_objects_per_prompt: 5
    redetect_interval_ms: 0.0
    reset_tracking_every_seconds: 30.0  # bound GPU memory growth; 0 to disable
    queue_depth: 5
    start_enabled: true
    cpu_threads: 1  # cap torch/cv2 thread pools (see sam3_node.py); raise if CPU profiling shows starvation

    # Hybrid pipeline (SAM3 detect every keyframe_every_ms, SAM2-tracker propagates between).
    # Set use_hybrid: false for unconditional per-frame detection (~1.6 fps multi-prompt).
    use_hybrid: true
    keyframe_every_ms: 1000.0  # wall-clock interval; decoupled from camera frame rate

    # Text-bootstrap → box-prompt: first N keyframes capture exemplar boxes from text detections;
    # subsequent keyframes inject them as box prompts for stable multi-prompt tracking.
    # Set bootstrap_frames: 0 to disable (pre-#17 pure text-prompt behaviour).
    bootstrap_frames: 5
    bootstrap_min_score: 0.3
