sam3_inference:
  ros__parameters:
    model_name: facebook/sam3
    prompts: ["sidewalk", "grass", "street", "car"]
    class_ids: [1, 2, 3, 4]
    device: cuda
    score_threshold: 0.5
    mask_threshold: 0.5
    queue_depth: 5
    start_enabled: true
    compile_cache_path: /cache/sam3_compiled.pt
