sam3_inference:
  ros__parameters:
    checkpoint: /home/sam3-demo-usr/opennav-sam3-inference-model/sam3  # Absolute path to the SAM3 checkpoint
    onnx_dir: /home/sam3-demo-usr/opennav-sam3-inference-model/onnx_files_504  # Absolute path to the directory containing ONNX files
    
    # prompts: ["sidewalk", "grass"]
    # class_ids: [1, 2]
    
    prompts: ["computer"]
    class_ids: [1]

    # prompts: ["asphalt lane", "bike lane", "sidewalk", "bushes and plants"]
    # class_ids: [1, 2, 3, 4]

    # prompts: ["floor"]
    # class_ids: [1]
    
    device: cuda
    score_threshold: 0.5
    max_objects_per_prompt: 5
    redetect_interval_ms: 0.0
    reset_tracking_every_seconds: 30.0  # bound GPU memory growth; 0 to disable
    queue_depth: 5
    start_enabled: true
